<!doctype html>
<html>

<head>
   <title>Pacman</title>
   <meta charset="UTF-8">
   <link href='https://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
   <link href='src/all.css' rel="stylesheet" type="text/css">
   <script type="module" src="/src/pacman.ts" defer></script>
</head>

<body>

  <div class='content'> 

    <h1>Pacman in your browser!</h1>

    <div id='parent'></div>

    <div class='panel'>

      <div class='panel-header'>
        <h3>How to Play</h3>
      </div>

      <div class='info'>

        <h4>Controls:</h4>
        <ol>
          <li><kbd>Enter</kbd> Start game / Pause</li>
          <li><kbd>Arrow Keys</kbd> Move around</li>
          <li><kbd>M</kbd> Toggle sound (mute)</li>
        </ol>

        <h4>Cheats:</h4>
        <ul>
          <li><kbd>Z + X</kbd> Next level</li>
          <li><kbd>Z + C</kbd> Commit suicide</li>
          <li><kbd>Z + G</kbd> Toggle God Mode</li>
        </ul>

      </div>

      <div class='panel-footer'>
        Build date: Unknown
      </div>
    </div>

  </div>
</body>

</html>
